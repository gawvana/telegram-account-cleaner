version: "3.8"

services:
  bot:
    build: .
    container_name: clin_bot
    restart: unless-stopped
    command: python main.py
    env_file: .env
    environment:
      - DATABASE_PATH=/app/data/cleaner.db
      - SCHEDULER_ENABLED=true
    volumes:
      - session_data:/app/sessions
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  webapp:
    build: .
    container_name: clin_webapp
    restart: unless-stopped
    command: uvicorn webapp_server:app --host 0.0.0.0 --port 8080
    env_file: .env
    environment:
      - DATABASE_PATH=/app/data/cleaner.db
      - SCHEDULER_ENABLED=false
    ports:
      - "8080:8080"
    volumes:
      - session_data:/app/sessions
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  session_data:
